  - {chinese: 这门课程把讲授与实地考察相结合，让学生亲身了解当地的社会变迁。, en: 'This course combines instruction with field visits, allowing students to experience local social change firsthand.', topic: school_work, targets: [实地, 亲身, 变迁], grammar: []}
