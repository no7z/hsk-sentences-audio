  - {chinese: 这份报告虽然篇幅有限，却对争议的来龙去脉作了深入的剖析。, en: 'Although limited in length, this report offers an in-depth analysis of how the dispute arose and developed.', topic: school_work, targets: [篇幅, 来龙去脉], grammar: []}
  - {chinese: 与其堆砌专业术语，不如用具体的个案说明概念之间的关联。, en: 'Rather than piling up technical terms, it is better to illustrate how the concepts relate through specific cases.', topic: school_work, targets: [与其, 堆砌, 个案], grammar: []}
  - {chinese: 调查结果只能说明两者相关，尚不足以证实其中存在因果关系。, en: The survey results show only a correlation and do not yet establish a causal relationship., topic: school_work, targets: [尚], grammar: []}
  # 工作与组织
  - {chinese: 新任主管上任后，先梳理了各部门的职责，再着手优化协作流程。, en: 'After taking office, the new manager first clarified each department''s responsibilities and then began improving the workflow for collaboration.', topic: school_work, targets: [上任, 梳理, 着手, 协作, 流程], grammar: []}
