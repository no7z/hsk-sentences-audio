  - {chinese: 她善于举一反三，学会一种方法后，总能把它迁移到新的情境中。, en: 'She is good at drawing broader lessons: after learning one method, she can apply it in new contexts.', topic: school_work, targets: [举一反三, 迁移], grammar: []}
