  # 法律与规则
  - {chinese: 合同中的条款一经双方签署，任何一方都不能擅自更改。, en: 'Once both parties sign the contract, neither may alter its terms without authorization.', topic: society, targets: [条款, 一经, 签署, 擅自], grammar: []}
  - {chinese: 法院驳回了这项请求，但当事人仍可依法提出上诉。, en: 'The court rejected the request, but the party concerned may still appeal in accordance with the law.', topic: society, targets: [驳回, 当事人, 上诉], grammar: []}
