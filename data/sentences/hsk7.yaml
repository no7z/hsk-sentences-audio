  # 经济与产业
  - {chinese: 原材料价格持续攀升，压缩了中小厂家的利润空间。, en: The continuing rise in raw material prices has squeezed the profit margins of small and medium-sized manufacturers., topic: economy, targets: [原材料, 攀升, 压缩, 厂家], grammar: []}
