  - {chinese: 由于保存不当，这份手稿残缺得很厉害，许多段落已无法辨认。, en: 'Because it was poorly preserved, this manuscript is badly incomplete, and many passages can no longer be made out.', topic: culture, targets: [残缺], token_pinyin: {残缺: cán quē}, gloss: {残缺: incomplete; damaged with parts missing}, grammar: []}
  - {chinese: 为了取象牙而杀死大象，这种做法实在太残忍了。, en: Killing elephants just to take their ivory is truly too cruel., topic: society, targets: [残忍], token_pinyin: {残忍: cán rěn}, gloss: {残忍: cruel; ruthless}, grammar: []}
  - {chinese: 想到自己很久没回家看望父母，他心里十分惭愧。, en: 'Thinking about how long it had been since he went home to see his parents, he felt deeply ashamed.', topic: feelings, targets: [惭愧], token_pinyin: {惭愧: cán kuì}, gloss: {惭愧: ashamed}, grammar: []}
  - {chinese: 听到这个坏消息，她的脸色一下子变得惨白，半天说不出话来。, en: 'On hearing the bad news, her face suddenly turned deathly pale, and she couldn''t speak for a long while.', topic: feelings, targets: [惨白], token_pinyin: {惨白: cǎn bái}, gloss: {惨白: deathly pale}, grammar: []}
  - {chinese: 那次火灾给了工厂负责人一个惨痛的教训，此后他对安全检查再也不敢马虎。, en: 'That fire taught the factory manager a painful lesson, and since then he has never dared to be careless about safety inspections.', topic: society, targets: [惨痛], token_pinyin: {惨痛: cǎn tòng}, gloss: {惨痛: painful; bitter (of a lesson or experience)}, grammar: []}
