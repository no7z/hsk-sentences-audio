name: Dataset checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt -r requirements-exam.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/enrich_exam_levels.py
      - run: npm --prefix packages/npm test
      - run: node --test tests/web_exports.test.mjs
      - run: node --test tests/browser_filters.test.mjs
      - run: python packages/python/scripts/prepare.py
      - run: python -m unittest discover -s packages/python/tests -v
